  espressif/esp_lcd_ek79007: "^2.0.2~1"          # EK79007 MIPI-DSI 面板驱动
  espressif/esp_lcd_touch_gt911: "^1"            # GT911 触摸驱动
  espressif/esp_lcd_touch:
    version: "^1"
    public: true                                 # 对外头文件暴露了 esp_lcd_touch_handle_t
